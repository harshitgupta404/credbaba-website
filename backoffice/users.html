<!DOCTYPE html>
<html lang="en">
<head>

    var t = localStorage.getItem('credbaba-theme');
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Backoffice Users | CredBaba</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="../assets/css/backoffice.css">
<script src="../assets/js/backoffice-auth.js"></script>
<script>
  if (!CredBabaBackofficeAuth.requireAuth()) {
    throw new Error('Unauthorized');
  }

</head>
<body class="admin-body">

  <div class="admin-header-inner">
    <div class="admin-brand-group">
      <a href="blogs.html" class="brand">
        <span class="brand-mark">CB</span>

      </a>
      <span class="admin-badge">Backoffice</span>
    </div>

    <nav class="admin-nav">
      <a href="blogs.html" class="admin-nav-link">

        Blogs
      </a>
      <a href="editor.html" class="admin-nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        New Blog
      </a>
      <a href="users.html" class="admin-nav-link active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Users
      </a>
      <a href="settings.html" class="admin-nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </a>
      <a href="../blog/" target="_blank" class="admin-nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Live Site
      </a>
    </nav>

    <div class="admin-user-group">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button id="logoutBtn" class="btn-logout">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </div>
</header>

<main class="admin-main" style="max-width: 1100px;">
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-6); flex-wrap: wrap; gap: var(--space-4);">
    <div>
      <h1 style="font-size: var(--text-2xl); font-family: var(--font-display); margin-bottom: 4px;">Backoffice Users</h1>
      <p style="color: var(--color-ink-soft); font-size: var(--text-sm);">Manage team access, marketing permissions, and administrative roles.</p>
    </div>
    <button type="button" id="openAddUserBtn" class="btn btn-primary" style="font-size: var(--text-xs); padding: 9px 18px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
      Add New Backoffice User
    </button>
  </div>

  <div class="admin-table-card">
    <table class="admin-table">
      <thead>
        <tr>
          <th>User</th>
          <th>Role</th>
          <th>Status</th>
          <th>Created Date</th>
          <th style="text-align: right;">Actions</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
      </tbody>
    </table>
  </div>
</main>

<!-- Modal: Add New User -->
<div class="modal-overlay" id="addUserModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Add Backoffice User</h3>
      <button class="modal-close" id="closeAddUserModal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="addUserForm">
      <div class="modal-body">
        <div class="form-field">
          <label for="newUsername" class="form-label">Username / Login ID</label>
          <input type="text" id="newUsername" class="form-input" required placeholder="e.g. rahul_marketing" autocomplete="off" />
        </div>
        <div class="form-field">
          <label for="newFullName" class="form-label">Full Name</label>
          <input type="text" id="newFullName" class="form-input" required placeholder="e.g. Rahul Sharma" />
        </div>
        <div class="form-field">
          <label for="newRole" class="form-label">Backoffice Role</label>
          <select id="newRole" class="form-select">
            <option value="Marketing Editor">Marketing Editor (Create & Edit Blogs)</option>
            <option value="Content Manager">Content Manager (Publish & Manage All Content)</option>
            <option value="Super Admin">Super Admin (Full Access)</option>
          </select>
        </div>
        <div class="form-field">
          <label for="newPassword" class="form-label">Temporary Password (minimum 8 characters)</label>
          <input type="password" id="newPassword" class="form-input" required minlength="8" autocomplete="new-password" />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" id="cancelAddUserBtn">Cancel</button>
        <button type="submit" class="btn btn-primary">Create User →</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="../assets/js/theme.js"></script>
<script>
  (function () {
    document.getElementById('logoutBtn').addEventListener('click', () => CredBabaBackofficeAuth.logout());

    const tableBody = document.getElementById('usersTableBody');
    const addUserModal = document.getElementById('addUserModal');
    const openAddUserBtn = document.getElementById('openAddUserBtn');
    const closeAddUserModal = document.getElementById('closeAddUserModal');
    const cancelAddUserBtn = document.getElementById('cancelAddUserBtn');
    const addUserForm = document.getElementById('addUserForm');

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          ${type === 'success' ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>' : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'}
        </svg>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function renderUsers() {
      const users = CredBabaBackofficeAuth.getUsers();
      tableBody.innerHTML = users.map(user => {
        const isActive = user.status === 'active';
        return `
          <tr>
            <td>
              <div style="font-weight: 600; color: var(--color-ink); font-family: var(--font-display);">${user.name || user.username}</div>
              <div style="font-size: 11px; font-family: var(--font-mono); color: var(--color-ink-faint);">@${user.username}</div>
            </td>
            <td>
              <span class="role-badge ${user.role === 'Super Admin' ? 'super-admin' : (user.role === 'Content Manager' ? 'content-manager' : 'marketing-editor')}">${user.role}</span>
            </td>
            <td>
              <span class="badge-status ${isActive ? 'published' : 'draft'}">
                <span class="admin-status-dot" style="background: ${isActive ? 'var(--color-success)' : 'var(--color-error)'}"></span>
                ${isActive ? 'Active' : 'Suspended'}
              </span>
            </td>
            <td>
              <div style="font-family: var(--font-mono); font-size: 12px; color: var(--color-ink-soft);">
                ${user.createdAt ? user.createdAt.split('T')[0] : '2026-08-15'}
              </div>
            </td>
            <td>
              <div class="action-btns" style="justify-content: flex-end;">
                ${!user.isPrimary ? `
                  <button class="btn-icon" title="${isActive ? 'Suspend User' : 'Activate User'}" data-toggle-status="${user.username}" data-new-status="${isActive ? 'suspended' : 'active'}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                  </button>
                  <button class="btn-icon delete" title="Delete User" data-delete-user="${user.username}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  </button>
                ` : `<span style="font-size: 11px; font-family: var(--font-mono); color: var(--color-ink-faint); padding: 4px 8px;">Primary</span>`}
              </div>
            </td>
          </tr>
        `;
      }).join('');

      document.querySelectorAll('[data-toggle-status]').forEach(btn => {
        btn.addEventListener('click', function () {
          const username = this.getAttribute('data-toggle-status');
          const newStatus = this.getAttribute('data-new-status');
          CredBabaBackofficeAuth.updateUser(username, { status: newStatus });
          showToast(`User @${username} status set to ${newStatus}.`);
          renderUsers();
        });
      });

      document.querySelectorAll('[data-delete-user]').forEach(btn => {
        btn.addEventListener('click', function () {
          const username = this.getAttribute('data-delete-user');
          if (confirm(`Are you sure you want to remove user @${username}?`)) {
            CredBabaBackofficeAuth.deleteUser(username);
            showToast(`User @${username} removed.`);
            renderUsers();
          }
        });
      });
    }

    openAddUserBtn.addEventListener('click', () => addUserModal.classList.add('show'));
    function closeAddUser() {
      addUserModal.classList.remove('show');
      addUserForm.reset();
    }
    closeAddUserModal.addEventListener('click', closeAddUser);
    cancelAddUserBtn.addEventListener('click', closeAddUser);

    addUserForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      const res = await CredBabaBackofficeAuth.addUser({
        username: document.getElementById('newUsername').value,
        name: document.getElementById('newFullName').value,
        role: document.getElementById('newRole').value,
        password: document.getElementById('newPassword').value
      });

      if (res.success) {
        showToast(res.message);
        closeAddUser();
        renderUsers();
      } else {
        showToast(res.message, 'error');
      }
    });

    renderUsers();
  })();
</script>
</body>
</html>
