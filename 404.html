<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CredBaba</title>
<meta name="description" content="Compare and apply for Personal Loans, Business Loans, and Home Loans with low interest rates across India.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%234338CA%22/><text x=%2250%22 y=%2266%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22%23C9A227%22 font-family=%22monospace%22>C</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  /* Blog reader formatting */
  .blog-post-header { padding: var(--space-7) 0 var(--space-2); max-width: 820px; }
  .blog-post-header h1 { font-size: clamp(var(--text-2xl), 4vw, var(--text-4xl)); margin-bottom: var(--space-3); line-height: 1.25; }
  .blog-meta { color: var(--color-ink-faint); font-size: var(--text-sm); margin-bottom: var(--space-2); }
  .blog-hero-image-wrap { margin: var(--space-4) 0 var(--space-4); border-radius: var(--radius-lg); overflow: hidden; max-height: 480px; border: 1px solid var(--color-border); }
  .blog-hero-image-wrap img { width: 100%; height: auto; object-fit: cover; display: block; }
  .blog-intro { font-size: var(--text-lg); color: var(--color-ink-soft); line-height: 1.7; border-left: 3px solid var(--color-indigo); padding-left: var(--space-5); margin: var(--space-2) 0 var(--space-5); }
  .blog-content { max-width: 820px; padding-bottom: var(--space-10); font-size: var(--text-base); }
  .blog-content h1 { font-size: clamp(var(--text-2xl), 3.5vw, var(--text-3xl)); margin-top: var(--space-9); margin-bottom: var(--space-4); line-height: 1.25; }
  .blog-content h2 { font-size: var(--text-2xl); margin-top: var(--space-9); margin-bottom: var(--space-4); line-height: 1.3; }
  .blog-content h3 { font-size: var(--text-xl); margin-top: var(--space-6); margin-bottom: var(--space-3); color: var(--color-ink); }
  .blog-content h4 { font-size: var(--text-lg); margin-top: var(--space-5); margin-bottom: var(--space-2); }
  .blog-content p { color: var(--color-ink-soft); line-height: 1.8; margin-bottom: var(--space-5); }
  .blog-content ul, .blog-content ol { color: var(--color-ink-soft); line-height: 1.75; margin-bottom: var(--space-5); padding-left: 1.6em; }
  .blog-content li { margin-bottom: var(--space-2); }
  .blog-content strong { color: var(--color-ink); font-weight: 600; }
  .blog-content blockquote { border-left: 4px solid var(--color-gold); background: var(--color-surface); padding: var(--space-4) var(--space-6); border-radius: 0 var(--radius-md) var(--radius-md) 0; margin: var(--space-6) 0; color: var(--color-ink); font-style: italic; }
  .breadcrumb { font-size: var(--text-sm); color: var(--color-ink-faint); margin-bottom: var(--space-4); }
  .breadcrumb a { color: var(--color-ink-soft); text-decoration: none; }
  .breadcrumb a:hover { color: var(--color-indigo); }
  
  /* Custom Rich Blocks */
  .summary-box { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-6); margin: var(--space-6) 0; }
  .summary-box h3 { margin-top: 0; color: var(--color-indigo); font-size: var(--text-lg); }
  .summary-box ul { margin-bottom: 0; }

  .blog-cta { background: linear-gradient(135deg, rgba(67, 56, 202, 0.08) 0%, rgba(201, 162, 39, 0.08) 100%); border: 1px solid var(--color-border); border-radius: var(--radius-xl); padding: var(--space-8); text-align: center; margin: var(--space-9) 0; }
  .blog-cta h2 { margin-top: 0; font-size: var(--text-2xl); }
  .blog-cta p { color: var(--color-ink-soft); max-width: 560px; margin: 0 auto var(--space-5); }

  /* Interactive FAQ Accordion */
  .faq-item { border-bottom: 1px solid var(--color-border); }
  .faq-question { width: 100%; background: none; border: none; text-align: left; padding: var(--space-5) 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); color: var(--color-ink); font-family: var(--font-display); font-size: var(--text-base); font-weight: 600; line-height: 1.4; }
  .faq-question:hover { color: var(--color-indigo); }
  .faq-icon { flex-shrink: 0; width: 20px; height: 20px; transition: transform 0.2s ease; }
  .faq-item.open .faq-icon { transform: rotate(45deg); }
  .faq-answer { display: none; padding-bottom: var(--space-5); color: var(--color-ink-soft); line-height: 1.7; }
  .faq-item.open .faq-answer { display: block; }
  
  .blog-disclaimer { color: var(--color-ink-faint); font-size: var(--text-xs); line-height: 1.6; border-top: 1px solid var(--color-border); padding-top: var(--space-6); margin-top: var(--space-8); }
  
  /* Floating Admin Quick-Edit Bar */
  .admin-quick-bar { display: none; position: fixed; bottom: 20px; right: 20px; background: var(--color-bg-raised); border: 1px solid var(--color-border); border-radius: 999px; padding: 8px 16px; box-shadow: var(--shadow-lg); z-index: 999; align-items: center; gap: 12px; }

  /* Generic 404 styles */
  .not-found-box { padding: var(--space-10) var(--space-4); text-align: center; max-width: 600px; margin: 0 auto; }
  .not-found-code { font-family: var(--font-mono); font-size: clamp(4rem, 8vw, 6rem); font-weight: 700; color: var(--color-indigo); line-height: 1; margin-bottom: var(--space-3); }
</style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/index.html" class="brand"><span class="brand-mark">CB</span>CredBaba</a>
    <nav class="nav-desktop">
      <div class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/home-loan/">Home Loan</a>
        <a href="/personal-loan/">Personal Loan</a>
        <a href="/business-loan/">Business Loan</a>
        <a href="/blog/" id="navBlogLink">Blog</a>
      </div>
    </nav>
    <div class="header-actions">
      <a href="/business-loan/" class="btn btn-primary header-cta">Apply Now</a>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode" aria-pressed="false">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button class="nav-toggle" id="navToggle" aria-label="Open menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <a href="/index.html">Home</a>
    <a href="/home-loan/">Home Loan</a>
    <a href="/personal-loan/">Personal Loan</a>
    <a href="/business-loan/">Business Loan</a>
    <a href="/blog/">Blog</a>
  </div>
</header>

<main class="container" id="postMain">
  <div id="loadingState" style="padding: var(--space-10) 0; text-align: center; color: var(--color-ink-faint);">
    <div style="font-size: var(--text-lg); margin-bottom: var(--space-2);">Loading...</div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="ledger-line"></div>
    <div class="footer-bottom">
      <span>© 2026 CredBaba. All rights reserved.</span>
      <span><a href="/pages/loans.html">Explore Loans</a> · <a href="/pages/faq.html">FAQs</a> · <a href="/pages/privacy.html">Privacy</a> · <a href="/pages/terms.html">Terms</a></span>
    </div>
  </div>
</footer>

<!-- Quick Admin Edit Bar -->
<div class="admin-quick-bar" id="adminQuickBar">
  <span style="font-size: 11px; font-family: var(--font-mono); color: var(--color-indigo); font-weight: 600;">Admin Mode</span>
  <a href="#" id="adminEditLink" style="font-size: 12px; color: var(--color-ink); text-decoration: none; font-weight: 600;">✏️ Edit Article</a>
  <button id="adminDownloadBtn" style="background: none; border: none; font-size: 12px; color: var(--color-ink); cursor: pointer; font-weight: 600;">📥 Export HTML</button>
</div>

<script src="/assets/js/theme.js"></script>
<script src="/assets/js/blog-store.js"></script>
<script src="/assets/js/backoffice-auth.js"></script>
<script>
  (async function () {
    const mainEl = document.getElementById('postMain');
    const path = window.location.pathname || '';

    // Check if the current route is a blog slug: /blog/:slug (supports optional .html and trailing slash)
    const blogMatch = path.match(/^\/blog\/([a-zA-Z0-9_-]+?)(?:\.html)?\/?$/);
    const slug = blogMatch ? blogMatch[1] : null;

    // Exclude reserved filenames
    const isReserved = slug === 'index' || slug === 'post' || slug === 'sync-receiver' || slug === 'data';

    if (slug && !isReserved) {
      if (path.endsWith('.html') || path.endsWith('/')) {
        try {
          window.history.replaceState(null, '', '/blog/' + slug + window.location.search);
        } catch (e) {}
      }
      document.getElementById('navBlogLink').classList.add('active');

      // Define render function for instant 0ms painting
      function renderBlog(blog) {
        if (!blog) return;

        // Update document head metadata for SEO
        document.title = `${blog.title} | CredBaba`;
        let metaDesc = document.querySelector('meta[name="description"]');
        if (metaDesc) metaDesc.setAttribute('content', blog.metaDescription || blog.excerpt || blog.title);

        // Add canonical link for SEO
        let canonical = document.querySelector('link[rel="canonical"]');
        if (!canonical) {
          canonical = document.createElement('link');
          canonical.rel = 'canonical';
          document.head.appendChild(canonical);
        }
        canonical.href = `https://credbaba.com/blog/${slug}`;

        const formattedDate = new Date(blog.publishedAt || Date.now()).toLocaleDateString('en-US', {
          month: 'long',
          year: 'numeric'
        });

        const isDraft = (blog.status || '').toLowerCase() === 'draft';
        const previewBanner = isDraft ? `
          <div style="background: rgba(201, 162, 39, 0.08); border: 1px dashed var(--color-gold); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); margin-bottom: var(--space-5); font-size: var(--text-xs); color: var(--color-ink); display: flex; align-items: center; justify-content: space-between;">
            <span><strong>Preview Mode:</strong> This article is saved as a <strong>Draft</strong> and is not visible on the public website.</span>
            <span style="font-weight: 600; text-transform: uppercase; font-size: 10px; padding: 2px 8px; border-radius: 4px; background: var(--color-gold); color: #fff;">Draft</span>
          </div>
        ` : '';

        const heroImageHtml = blog.heroImage ? `
          <div class="blog-hero-image-wrap">
            <img src="${blog.heroImage}" alt="${CredBabaBlogStore.escapeHtml(blog.title)}" />
          </div>
        ` : '';

        // Avoid duplicating the title if excerpt is identical or empty
        const isDuplicateExcerpt = (blog.excerpt || '').trim().toLowerCase() === (blog.title || '').trim().toLowerCase();
        const introHtml = (blog.excerpt && !isDuplicateExcerpt)
          ? `<div class="blog-intro">${CredBabaBlogStore.escapeHtml(blog.excerpt)}</div>`
          : '';

        // Strip leading empty paragraphs, whitespace, or br tags from blog.content
        const cleanContent = (blog.content || '')
          .replace(/^(\s*<p[^>]*>(\s*<br\s*\/?>|\s*&nbsp;|\s*)*<\/p>\s*|\s*<br\s*\/?>\s*)+/i, '');

        const faqItemsHtml = (blog.faqs || []).map(faq => `
          <div class="faq-item">
            <button class="faq-question" aria-expanded="false">
              ${CredBabaBlogStore.escapeHtml(faq.q)}
              <svg class="faq-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <div class="faq-answer">${faq.a}</div>
          </div>
        `).join('\n');

        mainEl.innerHTML = `
          <div class="blog-post-header">
            ${previewBanner}
            <div class="breadcrumb"><a href="/index.html">Home</a> / <a href="/blog/">Blog</a> / ${CredBabaBlogStore.escapeHtml(blog.title)}</div>
            <div class="eyebrow">${CredBabaBlogStore.escapeHtml((blog.category || 'LOAN GUIDE').toUpperCase())} · ${formattedDate.toUpperCase()}</div>
            <h1>${CredBabaBlogStore.escapeHtml(blog.title)}</h1>
            <div class="blog-meta">By ${CredBabaBlogStore.escapeHtml(blog.author || 'CredBaba Editorial Team')} &nbsp;·&nbsp; ${blog.readTime || '5 min read'}</div>
          </div>

          ${heroImageHtml}

          <div class="blog-content">
            ${introHtml}
            
            <div>${cleanContent}</div>

            ${faqItemsHtml ? `<h2 style="margin-top: var(--space-8); margin-bottom: var(--space-4);">Frequently Asked Questions</h2>\n${faqItemsHtml}` : ''}

            <div class="blog-cta">
              <h2>Explore Low Interest Loan Options with CredBaba</h2>
              <p>Submit your loan inquiry online in 2 minutes. Transparent options, fast approvals, zero spam.</p>
              <a href="/business-loan/" class="btn">Apply Online Today →</a>
            </div>

            <p class="blog-disclaimer">The information in this article is for general educational purposes only and does not constitute financial or legal advice. Interest rates, fees and loan terms vary by lender and applicant profile. CredBaba is a digital loan facilitation service (DSA) and does not directly lend money.</p>
          </div>
        `;

        // Interactive FAQs
        document.querySelectorAll('.faq-question').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var item = this.closest('.faq-item');
            var isOpen = item.classList.toggle('open');
            this.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
          });
        });

        // Quick Admin Edit bar if logged into backoffice
        if (typeof CredBabaBackofficeAuth !== 'undefined') {
          const session = CredBabaBackofficeAuth.getSession();
          if (session) {
            const quickBar = document.getElementById('adminQuickBar');
            const editLink = document.getElementById('adminEditLink');
            const downloadBtn = document.getElementById('adminDownloadBtn');
            quickBar.style.display = 'flex';
            editLink.href = `https://backoffice.credbaba.com/editor.html?id=${blog.id || blog.slug}`;
            downloadBtn.addEventListener('click', () => CredBabaBlogStore.downloadBlogHtml(blog));
          }
        }
      }

      const urlParams = new URLSearchParams(window.location.search);
      const isPreview = urlParams.get('preview') === '1';

      // 1. FAST PATH: Check synchronous local cache & builtins FIRST (0ms latency!)
      const cachedBlog = typeof CredBabaBlogStore !== 'undefined' ? CredBabaBlogStore.getBlogBySlug(slug) : null;
      if (cachedBlog && ((cachedBlog.status || '').toLowerCase() === 'published' || isPreview)) {
        renderBlog(cachedBlog);
        // Non-blocking background revalidation
        CredBabaBlogStore.fetchBlogBySlug(slug, { includeDraft: isPreview, skipLocal: true }).then(freshBlog => {
          if (freshBlog && freshBlog.updatedAt !== cachedBlog.updatedAt) {
            renderBlog(freshBlog);
          }
        }).catch(() => {});
        return;
      }

      // 2. Uncached: Show high-end skeleton placeholder (0 layout shift) while retrieving (< 1s)
      mainEl.innerHTML = `
        <div style="max-width: 800px; padding: var(--space-8) 0; margin: 0 auto;">
          <div style="height: 14px; width: 28%; background: var(--color-border); border-radius: 4px; margin-bottom: var(--space-4); opacity: 0.6;"></div>
          <div style="height: 40px; width: 88%; background: var(--color-border); border-radius: 6px; margin-bottom: var(--space-4); opacity: 0.7;"></div>
          <div style="height: 16px; width: 42%; background: var(--color-border); border-radius: 4px; margin-bottom: var(--space-7); opacity: 0.5;"></div>
          <div style="height: 240px; width: 100%; background: var(--color-border); border-radius: 12px; margin-bottom: var(--space-7); opacity: 0.4;"></div>
          <div style="height: 16px; width: 100%; background: var(--color-border); border-radius: 4px; margin-bottom: var(--space-3); opacity: 0.5;"></div>
          <div style="height: 16px; width: 94%; background: var(--color-border); border-radius: 4px; margin-bottom: var(--space-3); opacity: 0.5;"></div>
          <div style="height: 16px; width: 82%; background: var(--color-border); border-radius: 4px; margin-bottom: var(--space-3); opacity: 0.5;"></div>
        </div>
      `;

      // 3. Fast multi-tiered fetch (Static Edge CDN -> Cloud Apps Script with 2.5s hard timeout)
      let blog = null;
      if (typeof CredBabaBlogStore !== 'undefined') {
        blog = await CredBabaBlogStore.fetchBlogBySlug(slug, { includeDraft: isPreview });
      }

      if (!blog) {
        mainEl.innerHTML = `
          <div class="not-found-box">
            <h1 style="font-size: var(--text-3xl); margin-bottom: var(--space-3);">Article Not Found</h1>
            <p style="color: var(--color-ink-soft); margin-bottom: var(--space-6);">The article "${CredBabaBlogStore ? CredBabaBlogStore.escapeHtml(slug) : slug}" could not be located or is currently unpublished.</p>
            <a href="/blog/" class="btn btn-primary">← Return to Blog Directory</a>
          </div>
        `;
        return;
      }

      renderBlog(blog);
      return;
    }

    // Default 404 view for non-blog URLs
    document.title = 'Page Not Found | CredBaba';
    mainEl.innerHTML = `
      <div class="not-found-box">
        <div class="not-found-code">404</div>
        <h1 style="font-size: var(--text-2xl); margin-bottom: var(--space-3);">Page Not Found</h1>
        <p style="color: var(--color-ink-soft); margin-bottom: var(--space-6); font-size: var(--text-base);">The page you requested could not be found. It may have moved or no longer exists.</p>
        <div style="display: flex; gap: var(--space-3); justify-content: center; flex-wrap: wrap;">
          <a href="/index.html" class="btn btn-primary">Go to Homepage</a>
          <a href="/blog/" class="btn btn-outline">Explore Blog</a>
          <a href="/pages/loans.html" class="btn btn-outline">All Loans</a>
        </div>
      </div>
    `;
  })();

  // Mobile menu toggle
  document.getElementById('navToggle').addEventListener('click', function () {
    var menu = document.getElementById('mobileMenu');
    var open = menu.classList.toggle('open');
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
</script>
</body>
</html>
